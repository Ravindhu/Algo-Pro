# Package metadata and pytest settings. Layout rule: AGENTS.md "Project layout".
# Code lives in src/quant/ (package "quant"); the engine is src/quant/engines/ (package quant.engines).
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "algo-pro"
version = "0.1.0"
description = "Quant trading system for NSE/BSE. Paper and disabled live only. See AGENTS.md."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
# `quant.tests` is the quant suite and ships with the package on purpose: the
# tests resolve the repo root with parents[3], so they also run from an installed
# copy. Excluding them would silently drop 380 tests from an installed build.
include = ["quant*"]
exclude = ["quant.openalgo_platform*"]  # vendored upstream platform, not an installable package (decision 0013)

[tool.pytest.ini_options]
# The one place the suites are named. AGENTS.md, the CI workflow and the audits
# quote this list rather than keeping copies.
#   tests/unit      -> system-level and Blue-backed tests (the order-path rule, dashboards, ops)
#   src/quant/tests -> the quant suite, colocated with the package it tests
testpaths = ["tests/unit", "src/quant/tests"]

# Deprecation policy (2026-11-16). Our OWN code must not use a deprecated API:
# a DeprecationWarning is a scheduled breakage, and two had already accumulated
# silently (pandas 4 `sort_index(inplace=)`, `datetime.utcfromtimestamp`) because
# nothing failed the build on them.
#
# Scope is deliberate: `error` applies to our modules only. Forcing third-party
# libraries to raise would make the suite depend on a dependency's upgrade
# schedule, and the fix would not be ours to make. Those are filtered to
# `ignore` and should instead be handled by pinning versions in requirements.txt.
#
# Filter order matters: pytest applies filters so the LAST matching entry wins,
# hence the broad `error` comes first and the third-party `ignore` entries below
# override it for the libraries they name.
filterwarnings = [
    "error::DeprecationWarning",
    "ignore::DeprecationWarning:pandas.*",
    "ignore::DeprecationWarning:numpy.*",
    "ignore::DeprecationWarning:_pytest.*",
    "ignore::DeprecationWarning:pytest.*",
    "ignore::DeprecationWarning:pluggy.*",
    "ignore::DeprecationWarning:websocket.*",
    "ignore::DeprecationWarning:urllib3.*",
    "ignore::DeprecationWarning:requests.*",
    "ignore::DeprecationWarning:optuna.*",
    "ignore::DeprecationWarning:flask.*",
    "ignore::DeprecationWarning:werkzeug.*",
    "ignore::DeprecationWarning:sqlalchemy.*",
    "ignore::DeprecationWarning:dateutil.*",
    "ignore::DeprecationWarning:yfinance.*",
]
