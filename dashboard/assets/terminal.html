<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Algo-Pro terminal</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --fg:#e7e9ee; --muted:#8a90a0; --ok:#3ecf8e; --warn:#f5b942; --crit:#ff5c5c; }
  body { margin:0; font:14px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:12px 16px; display:flex; gap:12px; align-items:center; border-bottom:1px solid #262a33; }
  header h1 { font-size:16px; margin:0; flex:1; }
  button { background:#262a33; color:var(--fg); border:0; padding:6px 10px; border-radius:6px; cursor:pointer; }
  main { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:12px; padding:12px; }
  section { background:var(--card); border-radius:10px; padding:12px; }
  section h2 { font-size:13px; color:var(--muted); margin:0 0 8px; text-transform:uppercase; letter-spacing:.05em; }
  .big { font-size:22px; font-weight:600; }
  .muted { color:var(--muted); }
  table { width:100%; border-collapse:collapse; }
  td, th { text-align:left; padding:4px 2px; border-bottom:1px solid #262a33; }
  .CRITICAL { color:var(--crit); } .WARNING { color:var(--warn); } .INFO { color:var(--muted); }
  .insight { color:var(--muted); font-size:13px; margin:4px 0; }
  .hidden-pnl .pnl { filter: blur(6px); user-select:none; }
</style>
</head>
<body>
<header>
  <h1>Algo-Pro terminal <span class="muted">(paper, read-only)</span></h1>
  <span id="updated" class="muted"></span>
  <button id="toggle-pnl">Hide ₹</button>
</header>
<main id="main"><p class="muted" style="padding:12px">Loading…</p></main>
<script>
const $ = (id) => document.getElementById(id);
let pnlVisible = true;
let defaultVisible = true;
let pnlInitialised = false;
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const inr = (v) => v == null ? "—" : "₹" + Number(v).toLocaleString("en-IN", {maximumFractionDigits: 2});
const pct = (v) => v == null ? "—" : (v * 100).toFixed(1) + "%";
const num = (v) => v == null ? "—" : Number(v).toFixed(2);

function render(s) {
  if (!pnlInitialised) { defaultVisible = s.settings.pnl_visible_default; pnlVisible = defaultVisible; pnlInitialised = true; }
  const p = s.performance;
  const pos = s.positions.length
    ? "<table><tr><th>Symbol</th><th>Qty</th><th>Avg</th><th>Unrealized</th></tr>" +
      s.positions.map(x => `<tr><td>${esc(x.symbol)}</td><td>${x.qty}</td><td>${inr(x.avg_price)}</td><td class="pnl">${inr(x.unrealized_pnl)}</td></tr>`).join("") + "</table>"
    : '<p class="muted">No open positions.</p>';
  const ev = s.events.length
    ? "<table>" + s.events.map(e => `<tr><td class="${esc(e.severity)}">${esc(e.severity)}</td><td>${esc(e.kind)}</td><td>${esc(e.message)}</td></tr>`).join("") + "</table>"
    : '<p class="muted">No safety events.</p>';
  const limits = Object.entries(s.limits).filter(([k]) => k !== "blocked")
    .map(([k, v]) => `<tr><td>${esc(k)}</td><td>${v == null ? '<span class="CRITICAL">not set</span>' : esc(v)}</td></tr>`).join("");
  $("main").innerHTML = `
    <section><h2>Mode</h2><div class="big">${esc(s.mode)}</div>
      <p class="${s.kill_switch.active ? 'CRITICAL' : 'muted'}">Kill switch: ${s.kill_switch.active ? 'ACTIVE' : 'clear'}</p>
      <p class="muted">Feed: ${esc(s.feed.status)}</p></section>
    <section class="${pnlVisible ? '' : 'hidden-pnl'}"><h2>P&amp;L</h2>
      <div class="big pnl">${inr(p.realized_pnl)}</div>
      <p class="muted">Realized. Unrealized: <span class="pnl">${inr(p.unrealized_pnl)}</span></p></section>
    <section><h2>Performance</h2>
      <p>Trades: ${p.trades}</p><p>Win rate: ${pct(p.win_rate)}</p>
      <p>Profit factor: ${num(p.profit_factor)}</p><p>Risk use: ${pct(p.risk_utilisation)}</p></section>
    <section><h2>Positions</h2>${pos}</section>
    <section><h2>Risk limits</h2><table>${limits}</table></section>
    <section><h2>Safety events</h2>${ev}</section>
    <section><h2>AI insight <span class="muted">(rules, advice only)</span></h2>
      ${s.insight.map(t => `<p class="insight">• ${esc(t)}</p>`).join("")}</section>`;
  $("updated").textContent = "Updated " + new Date().toLocaleTimeString();
  $("toggle-pnl").textContent = pnlVisible ? "Hide ₹" : "Show ₹";
  document.querySelectorAll("section").forEach(sec => sec.classList.toggle("hidden-pnl", !pnlVisible && sec.querySelector(".pnl")));
}

async function refresh() {
  try { render(await (await fetch("/api/overview")).json()); }
  catch (e) { $("updated").textContent = "Offline: " + e; }
}
$("toggle-pnl").onclick = () => { pnlVisible = !pnlVisible; refresh(); };
refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
