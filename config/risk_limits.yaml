# Hard limits (INR). Minimum starter values set on 2026-11-04 for PAPER trading. Dates updated 2026-11-09.
# 2026-11-06: owner approved these minimums for PAPER (decision 0015) and set LIVE = same values
# (decision 0016). Live trading still blocked by the Phase 3 gate.
# 2026-11-09: owner set max_symbols_per_portfolio = 8 (paper).
# 2026-11-14: removed TWO duplicate max_symbols_per_portfolio keys (YAML silently
#             kept the last one, so the comment on the first was a lie) and added
#             the book-level caps from v5 2.6.
# Change only after a human review. NULL SEMANTICS (one rule, 2026-11-17): a null
# means NOT SET. Nothing is added for it, no threshold is invented for it, and its
# check REFUSES when it runs (fail closed): a live start or a gated intent with an
# unset cap is refused. A null never switches a check off.
# Mirrors RiskGate keys in src/quant/blue_engine/core/risk_gate.py.
max_order_quantity: 10          # shares per order
max_order_notional: 10000       # INR per order
max_open_exposure: 20000        # INR across all open entries
max_daily_loss: 20000           # INR, daily loss budget = 2% of capital 10,00,000 (owner 2026-11-19; set in dashboard Trade setup)
max_strategy_loss: 15000        # INR, loss budget per strategy per day = 1.5% of capital (owner 2026-11-19; set in dashboard Trade setup)
max_adv_pct: 0.01               # max 1% of average daily volume per order
max_symbols_per_portfolio: 8    # distinct symbols held at once (owner, 2026-11-09)
blocked: false                  # true = stop all entries

# --- Book-level caps (v5 2.6). A live start is REFUSED while any of these four is null
#     (2026-11-15). A null is NOT SET, not "check disabled": portfolio_risk_checks
#     refuses an unset cap and RiskLimits.unset() blocks a live start. Owner must set
#     them before live. ---
max_sector_pct: null            # fraction of capital in one sector (0.30 = 30%)
max_beta: null                  # book beta versus the index (1.20 = 1.2x)
max_cvar: null                  # fraction of capital, 99% CVaR (0.05 = 5%)
max_drawdown: null              # fraction of capital, max drawdown (0.20 = 20%)
