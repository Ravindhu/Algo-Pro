# Global settings: modes, paths. Scaffold placeholder.
mode: paper   # paper | live

sizing:
  # Risk per trade as a share of equity. 2026-11-08 owner instruction: 0.5% (was 0.25%).
  # Read by core/config.py; values outside (0, 0.05] are refused.
  risk_per_trade: 0.005

cycle:
  # Owner 2026-11-19. target_r = N in avg + N x R (rules doc 11.7). 2.1 = owner value.
  target_r: 2.1
  # Per-cycle loss ceiling as a fraction of equity: 0.01 = 1 % (owner 2026-11-19, was 3.1 %). Planned risk at stop of all
  # orders in one HTF cycle may not exceed this (rules doc 11.10, risk_ladder.py).
  loss_ceiling: 0.01
  # Owner 2026-11-19 (recommended, accepted): planned risk at the HTF stops across ALL open cycles (all symbols)
  # may not exceed this fraction of equity. Owner 2026-11-20: 5 % (was 3 %). Not set = no new orders (fail closed).
  portfolio_loss_ceiling: 0.05
  # Owner tree (2026-11-20, confirmed top-down). Per-symbol allocation as a percent of equity. 4 = reference.
  # The portfolio engine will set this per symbol later; every tree budget scales from it.
  symbol_allocation_pct: 4.0
  # 60 % aggressive (3 OCL slots) / 40 % conservative (2 OCL slots). Allowed range 0.30 to 0.80 (refused outside).
  aggressive_share: 0.60
  # Note: with symbol_allocation_pct set, the tree replaces the old ladder budgets. loss_ceiling (1 %) is then unused.

dashboard:
  # Show P&L when the page opens. AGENTS rule 8 says true. Owner decision D8 (docs/REPO_LAYOUT_PLAN.md) is still open.
  pnl_visible_default: true

# LIVE (2026-11-15). Both must be set by the owner before any live start (dashboard setup panel or
# by hand). null refuses it.
live:
  # Fixed INR cap on the capital the live bot may size against. Sizing uses the lower of
  # this and the broker's available cash.
  # Owner 2026-11-25: 10,00,000 INR cap, matching risk_budget.capital_inr.
  max_capital_inr: 1000000

# MARGIN-FUNDED DELIVERY (MTF). Owner 2026-11-25. Off until the owner sets mtf_enabled: true.
# BUY delivery entries may use it while the borrowed total stays within mtf_borrow_pct of
# risk_budget.capital_inr. Before each MTF order the broker's returned margin must imply a leverage
# above 1 and at most mtf_max_leverage (5 = 80% funding, the broker maximum). Read at bot start.
margin:
  mtf_enabled: false
  mtf_borrow_pct: 0.30
  mtf_max_leverage: 5.0
  # Interest on the borrowed amount, per year (owner 2026-11-25: 12%). Charged per day held.
  mtf_annual_rate: 0.12

# PAPER trading (2026-11-08). Paper only; no broker orders.
risk_budget:
  # Owner 2026-11-19. Loss caps as a share of capital. Set from dashboard Trade setup.
  # Saving them also writes the rupee caps in config/risk_limits.yaml.
  capital_inr: 1000000
  max_daily_loss_pct: 0.02
  max_strategy_loss_pct: 0.015

paper:
  # Paper capital (INR). Owner decision 2026-11-08. Used by portfolio/paper_qty.py.
  capital: 1000000
  # Dates when the scanner does not enter trades. 2026-11-08 = Muhurat session (owner: skip).
  skip_dates: ["2026-11-08"]

# Trade setup timeframes. Owner 2026-11-25: 5m LTF, 15m HTF, 75m MTF (sequence strategies).
# MTF below 1d makes the bot's product MIS (intraday, square-off at the broker cutoff).
trade_setup:
  timeframes:
    ltf: 5m
    htf: 15m
    mtf: 75m
