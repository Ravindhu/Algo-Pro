# Global settings: modes, paths. Scaffold placeholder.
mode: paper   # paper | live

sizing:
  # Risk per trade as a share of equity. 2026-11-08 owner instruction: 0.5% (was 0.25%).
  # Read by core/config.py; values outside (0, 0.05] are refused.
  risk_per_trade: 0.005

dashboard:
  # Show P&L when the page opens. AGENTS rule 8 says true. Owner decision D8 (docs/REPO_LAYOUT_PLAN.md) is still open.
  pnl_visible_default: true

# PAPER trading (2026-11-08). Paper only; no broker orders.
paper:
  # Paper capital (INR). Owner decision 2026-11-08. Used by portfolio/paper_qty.py.
  capital: 1000000
  # Dates when the scanner does not enter trades. 2026-11-08 = Muhurat session (owner: skip).
  skip_dates: ["2026-11-08"]
