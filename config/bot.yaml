# 5-minute strategy bot. mode: paper (simulated fills), analyze (OpenAlgo sandbox) or live.
# Live runs ONLY through scripts/run/run_strategy_bot_live.py. Live needs mode: live AND
# live_enabled: true here, plus every start gate. The committed value is paper and live_enabled
# stays false. The live data source must be approved in config/data_sources.yaml.
# Real-money trading needs a recorded human LiveApproval (execution/openalgo_client.py). Not set here.
mode: paper                  # paper | analyze | live (live also needs live_enabled and the live runner)
live_enabled: false
# Entries are LIMIT orders this many basis points above the last close (audit fix 6, 2026-11-15).
# Exits and broker stops are never limited. Owner may change it (0 < x <= 200).
entry_max_slippage_bps: 20
interval_minutes: 5          # one slice per parent per cycle
pov: 0.1
pov_mode: peg_band_buyer   # default. Entries: VWAP band sets the rate, buyer share sets the volume, bounded peg LIMIT at best bid + tick. Exits always fixed. Any missing input falls back to fixed (pov x full bar volume). 'fixed' = pov x full bar volume only. See docs/POV_MODES_IMPLEMENTATION_2026-11-16.md
# pov_band:               # used only when pov_mode: band; defaults shown
#   vwap_ceiling_pct: 0.5   # HALT above VWAP + this %
#   vwap_floor_pct: 3.0     # passthrough below VWAP - this %
#   min_pov: 0.05           # POV at the HIGH of the band (lower slicing)
#   max_pov: 0.25           # POV at the LOW of the band (higher slicing)
#   passthrough_floor: part_pct
# No verified buyer VWAP source yet, so band mode falls back to pov.                     # child = 10% of the last closed bar's volume, at most what is left
# Risk per trade is NOT set here. It is config/settings.yaml sizing.risk_per_trade (one source).
max_cycles: 12               # a parent is dropped after 1 hour of 5-minute cycles
max_screen_age_minutes: 10   # older screen file = no new symbols
screen_path: data/screened/latest.json   # written by the screener; data/ is git-ignored
data_sources_path: config/data_sources.yaml
# Strategy list. Plain name = defaults. name+params = per-symbol OCL settings, passed
# straight through to the OCL class (pattern, HTF/LTF intervals, trigger level, exec mode).
# Examples:
#   strategies:
#     - engulfing               # sequence strategies (need MTF, HTF, LTF in trade setup)
#     - engulfing_fail
#     - ocl_seq
#     - ocl_sell_fail_top_seq
#     - ocl_sell_fail_bottom_seq
# (The legacy OCL classes ocl, ocl_sell_fail_top and ocl_sell_fail_bottom were retired 2026-11-20.)
# Order product: auto = MIS if the MTF timeframe is below 1d, else CNC (from settings trade_setup).
product: auto

strategies:
  - engulfing
  - engulfing_fail
  - ocl_seq
  - ocl_sell_fail_top_seq
  - ocl_sell_fail_bottom_seq
# Per-strategy breakeven and trail (optional). Only breakeven_r (x R) and trail_mult (x ATR)
# may be set. A strategy not listed uses the global values from this file (1R, 2 ATR).
# Each name must be in the strategies list above. Example:
#   exits:
#     engulfing: {breakeven_r: 1.0, trail_mult: 1.5}
exits: {}
