# 5-minute strategy bot. mode: paper (simulated fills) or analyze (OpenAlgo sandbox). live is refused.
# live_enabled must stay false. The live data source must be approved in config/data_sources.yaml.
# Real-money trading needs a recorded human LiveApproval (execution/openalgo_client.py). Not set here.
mode: paper                  # paper | analyze (live is refused in code)
live_enabled: false
interval_minutes: 5          # one slice per parent per cycle
pov: 0.1                     # child = 10% of the last closed bar's volume, at most what is left
risk_per_trade: 0.0025       # same as config/settings.yaml sizing.risk_per_trade
max_cycles: 12               # a parent is dropped after 1 hour of 5-minute cycles
max_screen_age_minutes: 10   # older screen file = no new symbols
screen_path: data/screened/latest.json   # written by the screener; data/ is git-ignored
data_sources_path: config/data_sources.yaml
strategies: [engulfing]      # OCL strategies need a bar adapter; not in bot v1
