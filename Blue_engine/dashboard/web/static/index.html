<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>POV Terminal</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/"><span class="dot" aria-hidden="true"></span><strong>POV Terminal</strong></a>
    <span class="badge">READ-ONLY</span>
    <span class="chip" id="chip-mode">mode: …</span>
    <nav id="nav" class="nav" aria-label="Dashboard sections"></nav>
  </header>

  <main id="view" class="view">
    <p class="muted">Loading…</p>
  </main>
  <p id="banner" class="banner" hidden></p>

  <dialog id="popup" aria-labelledby="popup-title">
    <header class="popup-head">
      <h2 id="popup-title">Section</h2>
      <div class="popup-actions">
        <button type="button" id="popup-refresh" class="ghost">Refresh</button>
        <button type="button" id="popup-close" class="ghost" aria-label="Close">✕</button>
      </div>
    </header>
    <div id="popup-status" class="status"></div>
    <div id="popup-body" class="popup-body"></div>
  </dialog>

  <script src="/static/flow.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
