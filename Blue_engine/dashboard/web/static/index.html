<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>POV Terminal</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="dot" aria-hidden="true"></span>
      <strong>POV Terminal</strong>
      <span class="badge">READ-ONLY</span>
    </div>
    <nav id="nav" class="nav" aria-label="Dashboard sections">
      <span class="muted">Loading sections…</span>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1>Trading system · full flow</h1>
      <p class="muted">Market data and macro sources feed the frontline engines, then alpha models,
        execution, the risk gate, the OpenAlgo bridge, and finally broker and exchange.
        Select any header button for live details.</p>
      <img class="shell" src="/static/neural_shell.svg" alt="Neural shell diagram of the full trading flow">
    </section>
    <p id="banner" class="banner" hidden></p>
  </main>

  <dialog id="popup" aria-labelledby="popup-title">
    <header class="popup-head">
      <h2 id="popup-title">Section</h2>
      <div class="popup-actions">
        <button type="button" id="popup-refresh" class="ghost">Refresh</button>
        <button type="button" id="popup-close" class="ghost" aria-label="Close">✕</button>
      </div>
    </header>
    <div id="popup-status" class="status"></div>
    <div id="popup-body" class="popup-body"></div>
  </dialog>

  <script src="/static/app.js"></script>
</body>
</html>
