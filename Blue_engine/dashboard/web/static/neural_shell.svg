<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="ns-title ns-desc">
<title id="ns-title">Trading system neural shell</title>
<desc id="ns-desc">Full flow: market data and macro sources feed frontline engines, then alpha models, then execution, then the risk gate, then the OpenAlgo bridge, then broker and exchange. The ledger and kill switch feed back into the risk gate.</desc>
<defs>
  <radialGradient id="core" cx="50%" cy="50%" r="60%">
    <stop offset="0%" stop-color="#1e293b"/><stop offset="100%" stop-color="#0b1220"/>
  </radialGradient>
  <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#a78bfa"/>
    <stop offset="100%" stop-color="#f43f5e"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
