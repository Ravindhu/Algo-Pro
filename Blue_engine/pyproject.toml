[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blue-engine"
version = "1.0.0"
description = "Blue engine suite (economic, market, portfolio, alpha, POV, infrastructure) + OCL dashboard built on the OpenAlgo Python SDK (client-side, upgrade-proof against OpenAlgo platform upgrades)"
requires-python = ">=3.10"
# SDK is PINNED: bump deliberately after testing, never silently with platform upgrades.
dependencies = [
    "openalgo==2.0.3",
]

[project.optional-dependencies]
# Plotly charts for the optimizer (optimizer/plots.py). The terminal dashboard was removed 2026-11-05.
charts = [
    "plotly>=5.18",
    "pandas>=2.0",
    "numpy>=1.26",
]
# Economic-engine analytics extras. ALL ARE OPTIONAL: the engine degrades to
# the dependency-free tanh scorer without them (see ECONOMIC_ENGINE_PLAN.md).
quant = [
    "numpy>=1.26",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "requests>=2.31",
]
# Screener engine: HTML parsing, authenticated transport, and PDF extraction
# for measured annual-report gap filling.
screener = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "python-dotenv>=1.0",
    "pypdf>=6.20.1",   # floor = the pinned, latest release; 5.x is not allowed
]
# OPTIONAL yfinance fallback for the screener's valuation layer. Used only to
# fill inputs screener.in does not publish (cash, DILUTED shares, minority
# interest, inventory/receivables, intangibles, capex). The engine degrades to
# screener.in-only values when this is absent - see screener/yf_fallback.py.
screener-fallback = [
    "yfinance>=0.2.40",
]
# Opt-in LLM text scoring (M7). Not required - the lexical fallback always runs.
llm = [
    "requests>=2.31",
]
# Advanced / frontier research (M8). Heavy; never on the production path.
deep = [
    "torch>=2.2",
]

# NOTE: engine sub-packages (alpha, economics, market, portfolio, pov,
# infrastructure) live FLAT directly under Blue_engine/ -- there is deliberately
# no intermediate `engines/` folder. Package names are mapped by package-dir
# below so `blue_engine.<name>` resolves to `<repo>/Blue_engine/<name>`.
[tool.setuptools]
packages = [
    "blue_engine",
    "blue_engine.core",
    "blue_engine.backtest",
    "blue_engine.optimizer",
    "blue_engine.alpha",
    "blue_engine.alpha.signals",
    "blue_engine.pov",
    "blue_engine.pov.slicers",
    "blue_engine.economics",
    "blue_engine.economics.providers",
    "blue_engine.economics.features",
    "blue_engine.economics.models",
    "blue_engine.economics.nlp",
    "blue_engine.market",
    "blue_engine.sectors",
    "blue_engine.screener",
    "blue_engine.screener.client",
    "blue_engine.database",
    "blue_engine.portfolio",
    "blue_engine.portfolio.providers",
    "blue_engine.portfolio.risk",
    "blue_engine.portfolio.optim",
    "blue_engine.portfolio.sizing",
    "blue_engine.portfolio.attribution",
    "blue_engine.portfolio.views",
    "blue_engine.infrastructure",
    "blue_engine.input",
]

[tool.setuptools.package-dir]
blue_engine = "."
"blue_engine.backtest" = "backtest"
"blue_engine.optimizer" = "optimizer"
"blue_engine.alpha" = "alpha"
"blue_engine.economics" = "economics"
"blue_engine.economics.providers" = "economics/providers"
"blue_engine.economics.features" = "economics/features"
"blue_engine.economics.models" = "economics/models"
"blue_engine.economics.nlp" = "economics/nlp"
"blue_engine.market" = "market"
"blue_engine.sectors" = "sectors"
"blue_engine.screener" = "screener"
"blue_engine.screener.client" = "screener/client"
"blue_engine.database" = "database"
"blue_engine.portfolio" = "portfolio"
"blue_engine.portfolio.providers" = "portfolio/providers"
"blue_engine.portfolio.risk" = "portfolio/risk"
"blue_engine.portfolio.optim" = "portfolio/optim"
"blue_engine.portfolio.sizing" = "portfolio/sizing"
"blue_engine.portfolio.attribution" = "portfolio/attribution"
"blue_engine.portfolio.views" = "portfolio/views"
"blue_engine.pov" = "pov"
"blue_engine.infrastructure" = "infrastructure"

[tool.setuptools.package-data]
"blue_engine.input" = ["*.json", "*.md"]

# ---------------------------------------------------------------------------
# pytest configuration
# ---------------------------------------------------------------------------
# WHY THIS EXISTS: the tests import the PACKAGED name (``blue_engine.backtest.*``)
# while the source lives flat on disk (``Blue_engine/backtest/``). Without a
# ``pythonpath`` entry, ``pytest`` from ``Blue_engine/`` resolves ``tests/`` but
# NOT ``blue_engine``, and the whole suite aborts at collection with
# ``ModuleNotFoundError: No module named 'blue_engine'``. That is a silent
# coverage hole: a red suite is obvious, an uncollectable one looks like "no
# failures". ``pythonpath = ["."]`` makes ``Blue_engine/`` the import root so
# ``blue_engine.<name>`` resolves via ``package-dir`` without requiring an
# editable install in every interpreter.
#
# CANONICAL INTERPRETER: ``..\.venv\Scripts\python.exe`` when the working
# directory is Blue_engine/ (the same repository venv used by the scheduled
# ``BlueEngine_DailyPortfolio`` task). Running another interpreter risks
# dependency drift between the tested and production path.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
filterwarnings = [
    "error::RuntimeWarning:blue_engine.*",
]

[tool.bandit]
# Run as: bandit -c pyproject.toml -r Blue_engine
# Tests use bare asserts and fixtures on purpose (B101, B311 random seeds), so
# they are excluded. Production code keeps every check. Do not add global
# skips here: fix or annotate the individual finding instead.
exclude_dirs = ["tests"]
