[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pov-engine"
version = "1.0.0"
description = "POV execution engine + OCL dashboard built on the OpenAlgo Python SDK (client-side, upgrade-proof against OpenAlgo platform upgrades)"
requires-python = ">=3.10"
# SDK is PINNED: bump deliberately after testing, never silently with platform upgrades.
dependencies = [
    "openalgo==2.0.3",
]

[project.optional-dependencies]
dashboard = [
    "dash>=2.14",
    "plotly>=5.18",
    "pandas>=2.0",
    "numpy>=1.26",
]

[tool.setuptools]
packages = [
    "pov_engine",
    "pov_engine.core",
    "pov_engine.signals",
    "pov_engine.slicers",
    "pov_engine.dashboard",
    "pov_engine.dashboard.pages",
    "pov_engine.input",
]

[tool.setuptools.package-dir]
pov_engine = "."

[tool.setuptools.package-data]
"pov_engine.input" = ["*.json", "*.md"]
