name: tests

on:
  push:
  pull_request:

jobs:
  unit-and-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit and parity tests
        run: python -m pytest tests/unit tests/parity -q
