# ============================================================================
# nginx.conf - TLS reverse proxy for OpenAlgo + POV Dash terminal
# Install to: /etc/nginx/sites-available/my-trading-system
# Symlink:    /etc/nginx/sites-enabled/my-trading-system
#
# Replaces YOUR_DOMAIN and the certbot lines after running:
#     sudo certbot --nginx -d your-domain.com
#
# Security posture:
#   - platform + dashboard bind to loopback; ONLY nginx is public
#   - TLS 1.2+ only
#   - WebSocket upgrade headers are mandatory for SocketIO (order updates)
# ============================================================================

# ---- upstreams (loopback only) ----
upstream openalgo_app {
    server 127.0.0.1:5000;
    keepalive 32;
}

upstream pov_dash_app {
    server 127.0.0.1:8050;
    keepalive 16;
}

# ---- rate limiting: brute-force protection on the login surface ----
limit_req_zone $binary_remote_addr zone=openalgo_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # certbot inserts its challenge + redirect here.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name YOUR_DOMAIN;

    # ---- TLS (managed by certbot) ----
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ---- security headers ----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;          # dashboard iframe needs SAMEORIGIN
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 50m;

    # ---------------------------------------------------------------- OpenAlgo
    location / {
        proxy_pass http://openalgo_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # >>> REQUIRED for flask-socketio (threading mode uses long-poll + WS)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_buffering off;
        proxy_read_timeout  3600s;   # long-poll/WS must not be cut at 60s
        proxy_send_timeout  3600s;
        proxy_connect_timeout 10s;
    }

    # ---- brute-force guard on auth ----
    location ~ ^/(auth|login) {
        limit_req zone=openalgo_login burst=5 nodelay;
        proxy_pass http://openalgo_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- optional: expose the POV Dash terminal (own subdomain preferred).
    # If you use a subdomain, move this block into its own server{} with
    # server_name dash.YOUR_DOMAIN. Path-based works too but Dash needs the
    # /_dash-update-component + websocket routes intact, hence the catch-all.
    location /pov-dash/ {
        # strip the prefix before handing to Dash
        proxy_pass http://pov_dash_app/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # >>> Plotly Dash websockets
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # ---- do NOT expose the raw app ports or the WS proxy (8765) publicly ----
    location ~ ^/(8000|8050|8765)$ { deny all; }
}